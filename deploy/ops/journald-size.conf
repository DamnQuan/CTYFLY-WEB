# CTYFLY：systemd journal 上限与保留期
#
# 背景：2026-10-17 巡检发现 journal 默认按磁盘 10%，≈4.9G 增长；
# 2026-10-18 站长要求「所有日志在服务器留档，官网保留 30 天」——
# 官网，数据库日志由 app/logretention.py 归档+清理到 30 天，
# 系统/服务日志，journald 则在服务器上保留更久，便于事后排查。
#
# 安装位置：/etc/systemd/journald.conf.d/size.conf
# 生效：systemctl restart systemd-journald，无需 reboot
[Journal]
# 2G 上限：先到先算，防止 journal 无界增长，磁盘共 49G
SystemMaxUse=2G
SystemMaxFileSize=128M
# 目标保留 365 天；实际以 2G 上限为准，空间不足时自动淘汰最旧日志
MaxRetentionSec=365day
