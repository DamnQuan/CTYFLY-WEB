# CTYFLY：nginx 访问日志保留，服务器留档
#
# 安装位置：替换 /etc/logrotate.d/nginx，Ubuntu 默认 rotate 14 = 仅两周，
# 无法满足「所有日志在服务器留档」。改为 365 天、压缩、按日轮转。
# nginx 日志本身很小，每日几十 KB，保留一年对磁盘影响可忽略。
#
# 校验：logrotate -d /etc/logrotate.d/nginx
/var/log/nginx/*.log {
	daily
	missingok
	rotate 365
	compress
	delaycompress
	notifempty
	create 0640 www-data adm
	sharedscripts
	prerotate
		if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
			run-parts /etc/logrotate.d/httpd-prerotate; \
		fi \
	endscript
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
