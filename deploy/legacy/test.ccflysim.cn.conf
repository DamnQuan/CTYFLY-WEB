# ===== CTY 飞控 · test.ccflysim.cn =====
# 前端静态文件由 nginx 直接托管；/api 与 /uploads 反代到本机 FastAPI 3010
# 与旧官网，server_name ccflysim.cn 互不影响

server {
    listen 80;
    listen [::]:80;
    server_name test.ccflysim.cn;

    root /opt/ctyfly/frontend/dist;
    index index.html;

    # 上传体积上限，航司 Logo 最大 2MB，留出余量
    client_max_body_size 4m;

    # 安全响应头，后端 API 已自带，静态资源这里补齐
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip：构建产物是文本，压缩收益明显
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 必须实时校验，否则构建更新后前端拿不到新版本
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖写入真实客户端 IP，不追加，避免伪造 XFF
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # 航路规划，sidecar 计算偶尔较慢，上传也走这里
        proxy_send_timeout 90s;
    }

    # 本地上传文件，航司 Logo 等
    location /uploads/ {
        proxy_pass http://127.0.0.1:3015;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        expires 7d;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/ctyfly-test.access.log;
    error_log  /var/log/nginx/ctyfly-test.error.log;
}

