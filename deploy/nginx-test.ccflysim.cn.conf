# ===== CTY 飞控 · test.ccflysim.cn =====
# 前端静态文件由 nginx 直接托管；/api 与 /uploads 反代到本机 FastAPI 3010
# 与旧官网，server_name ccflysim.cn 互不影响

server {
    server_name test.ccflysim.cn;

    root /opt/ctyfly-test/frontend/dist;
    index index.html;

    # 上传体积上限：2026-10-18 由 8m 提到 20m，活动海报 / 工单附件单文件 5MB，
    # 留足 multipart 余量；真正的精细上限在后端 BodySizeLimitMiddleware，见 main.py
    client_max_body_size 20m;

    # 超限统一返回 JSON —— nginx 默认回 HTML 错误页，前端 api.js 拿不到可读原因
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":"上传内容过大，超出服务器单次上限（20 MB），请压缩后重试"}';
    }

    # 安全响应头，后端 API 已自带，静态资源这里补齐
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip：构建产物是文本，压缩收益明显
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html 必须实时校验，否则构建更新后前端拿不到新版本
    # 注意：nginx 的 add_header 一旦在某个 location 内出现，就不再继承 server 级的头。
    # try_files 的内部跳转会落到这里，所以 server 级的三条安全头必须在此重复一遍，
    # 否则 HTML 文档会丢掉 X-Frame-Options / nosniff / Referrer-Policy。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://q1.qlogo.cn https://q2.qlogo.cn https://q3.qlogo.cn https://q4.qlogo.cn data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖写入真实客户端 IP，不追加，避免伪造 XFF
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # 航路规划，sidecar 计算偶尔较慢，上传也走这里
        proxy_send_timeout 90s;
    }

    # 本地上传文件，航司 Logo 等
    location /uploads/ {
        proxy_pass http://127.0.0.1:3016;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        expires 7d;
    }

    # 公共静态文件缓存，合作伙伴 logo 在 dist 内；uploads 由后端服务保持原代理
    location ~ ^/(favicon|apple-touch-icon|manifest) {
        root /opt/ctyfly-test/frontend/dist;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/ctyfly-test.access.log;
    error_log  /var/log/nginx/ctyfly-test.error.log;

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/test.ccflysim.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/test.ccflysim.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}



server {
    if ($host = test.ccflysim.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name test.ccflysim.cn;
    return 404; # managed by Certbot


}
