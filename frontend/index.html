<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 站点图标：翅膀取自「垂天云集团」标志；完整 logo 是三行，缩到 16px 会糊 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA：玩家可把 CTYFLY 添加到手机主屏幕，全屏打开，飞行上报更顺手-->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 头像来自腾讯 QQ 头像服务，属于跨域第三方域名：
         提前做 DNS 解析与连接，省掉每个头像首次加载时的 DNS + TLS 往返。
         弱网下这部分开销往往比图片本身还大。 -->
    <link rel="preconnect" href="https://q1.qlogo.cn" crossorigin />
    <link rel="dns-prefetch" href="https://q1.qlogo.cn" />
    <!--
      主题：下面的内联样式按系统偏好铺首屏底色；
      这段脚本在 CSS 绘制前恢复已保存的主题，避免深色用户白闪。
      JS 加载后 theme.js 接管，AUTO 跟随系统实时切换。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ctyfly_theme');
          var dark = t === 'dark'
            || ((t === 'auto' || !t) && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) { /* 无存储权限时交给 theme.js 处理 */ }
      })();
    </script>
    <title>CTYFLY</title>
    <!-- 首屏最小关键样式：先铺底色与字体栈，避免 JS/CSS 到达前白屏闪烁 -->
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { min-height: 100vh; }
      @media (prefers-color-scheme: dark) {
        body { background: #000000; color: #f5f5f7; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
